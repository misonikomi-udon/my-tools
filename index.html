<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My Tools</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  padding: 24px 16px 40px;
  background: #f5f7f5;
  color: #26332d;
  font-family: -apple-system, BlinkMacSystemFont, "Helvetica Neue", sans-serif;
}

.container {
  max-width: 600px;
  margin: 0 auto;
}

h1 {
  margin: 10px 0 6px;
  font-size: 32px;
}

.subtitle {
  margin: 0 0 24px;
  color: #718078;
  font-size: 14px;
}

.card {
  display: block;
  text-decoration: none;
  color: inherit;
  background: white;
  border-radius: 20px;
  padding: 20px;
  margin-bottom: 14px;
  box-shadow: 0 4px 14px rgba(0,0,0,0.06);
  border: 1px solid #e3e9e5;
}

.icon {
  font-size: 36px;
  margin-bottom: 10px;
}

.card-title {
  font-size: 19px;
  font-weight: 700;
  margin-bottom: 6px;
}

.card-description {
  color: #718078;
  font-size: 14px;
  line-height: 1.6;
}

.open {
  margin-top: 16px;
  display: inline-block;
  padding: 9px 14px;
  border-radius: 12px;
  background: #e5f1e9;
  color: #35634b;
  font-size: 13px;
  font-weight: 600;
}
</style>
</head>

<body>

<div class="container">

  <h1>My Tools</h1>
  <p class="subtitle">自分用ツールをまとめています</p>

  <a class="card" href="skincare.html">
    <div class="icon">🧴</div>
    <div class="card-title">スキンケア成分チェック</div>
    <div class="card-description">
      スキンケア商品の成分を確認するためのツール
    </div>
    <div class="open">▶ 開く</div>
  </a>

</div>

</body>
</html>
